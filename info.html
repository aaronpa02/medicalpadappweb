<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MedicalPad WebApp</title>
<style>
  :root{
    --bg:#f1f5f9; --card:#ffffff; --muted:#64748b; --primary:#4f46e5; --success:#16a34a; --danger:#ef4444;
  }
  body{font-family:Inter, Arial, sans-serif;background:var(--bg);margin:0;padding:24px;color:#0f172a}
  .container{max-width:1024px;margin:0 auto}
  .panel{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 6px 18px rgba(2,6,23,0.06);margin-bottom:18px}
  h1{font-size:20px;margin:0 0 6px}
  h2{font-size:16px;margin:0 0 12px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  input[type="text"],input[type="number"],select,textarea{width:100%;padding:14px;border:1px solid #e2e8f0;border-radius:10px;font-size:16px;box-sizing:border-box}[type="number"],select,textarea{width:100%;padding:10px;border:1px solid #e6eef8;border-radius:8px;font-size:14px}
  .grid{display:grid;gap:16px}
  .grid.cols-3{grid-template-columns:repeat(3,1fr)}
  .grid.cols-2 {
    grid-template-columns: repeat(2, 1fr);
    align-items: start;
  }

  .row{display:flex;gap:12px}
  .btn {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    width: 100%;
    text-align: center;
  }
  .btn.ghost{background:transparent;border:1px solid #e6eef8;color:var(--muted)}
  .btn.danger{background:var(--danger)}
  .small{font-size:13px;color:var(--muted)}
  .summary{font-size:14px;color:#0f172a}
  .history-item{background:#f8fafc;border:1px solid #e6eef8;padding:12px;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .badge{background:#eef2ff;color:var(--primary);padding:6px 8px;border-radius:8px;font-weight:600}
  @media (max-width: 900px){
    .panel.grid{grid-template-columns:1fr !important}
  }
  input.pretty-date{
    appearance:none;
    -webkit-appearance:none;
    background:#fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="%2364748b"><path d="M6 2a1 1 0 0 1 1 1v1h6V3a1 1 0 1 1 2 0v1h1a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1V3a1 1 0 0 1 2 0v1h6V3a1 1 0 1 1 2 0v1h1Zm14 6H2v8a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8Z"/></svg>') no-repeat right 12px center;
    background-size:20px;
    padding-right:40px;
    border:1px solid #e2e8f0;
    border-radius:10px;
    font-size:16px;
    padding:14px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="panel" style="display:flex;justify-content:space-between;align-items:center">
    <div>
      <h1>MedicalPad — Evaluación rápida</h1>
      <div class="small">Simulador / prototipo: SVB / SVA</div>
    </div>
    <div style="text-align:right">
      <div id="patientName" class="small">Paciente Ejemplo</div>
      <div id="patientId" class="small" style="color:var(--muted)"></div>
    </div>
  </div>

  <div class="panel">
    <h2>Datos del paciente</h2>
    <div class="grid cols-3">
      <div>
        <label>Nombre</label>
        <input id="name" type="text" />
      </div>
      <div>
        <label>Tipo de documento</label>
        <select id="idType">
          <option value="">Seleccionar</option>
          <option value="SIP">SIP</option>
          <option value="DNI">DNI</option>
          <option value="NIE">NIE</option>
          <option value="Pasaporte">Pasaporte</option>
        </select>
      </div>
      <div>
        <label>Número de documento</label>
        <input id="idNumber" type="text" />
      </div>
      <div>
        <label>Teléfono</label>
        <input id="phone" type="text" />
      </div>
      <div>
        <label>Dirección</label>
        <input id="address" type="text" />
      </div>
      <div>
        <label>Fecha de nacimiento</label>
        <input id="dob" type="date" class="pretty-date" />
      </div>
    </div>
  </div>

  <div class="panel grid" style="grid-template-columns:1fr 360px;gap:16px;align-items:start">
    <div>
      <h2>Signos Vitales</h2>
      <div class="grid cols-2">
        <div>
          <label>Frecuencia cardíaca (lpm)</label>
          <input id="hr" type="number" />
        </div>
        <div>
          <label>Frecuencia respiratoria (rpm)</label>
          <input id="rr" type="number" />
        </div>
        <div>
          <label>SpO₂ (%)</label>
          <input id="spo2" type="number" />
        </div>
        <div>
          <label>Temperatura (°C)</label>
          <input id="temp" type="number" step="0.1" />
        </div>
        <div>
          <label>TA sistólica</label>
          <input id="sbp" type="text" maxlength="3" />
        </div>
        <div>
          <label>TA diastólica</label>
          <input id="dbp" type="text" maxlength="3" />
        </div>
        <div>
          <label>Glucemia (mg/dL)</label>
          <input id="glucose" type="text" placeholder="mg/dL" />
        </div>
      </div>
      <div style="margin-top:12px;display:flex;gap:14px;flex-wrap:wrap">
        <button class="btn" id="saveVitalsBtn">Guardar valores</button>
        
      </div>

      <div id="vitalsMessage" class="small" style="margin-top:8px"></div>

      <div id="historyContainer" style="margin-top:18px"></div>
    </div>

    <div>
      <h2>Resumen Rápido</h2>
      <div class="panel" style="padding:12px">
        <div class="summary"><strong>FC:</strong> <span id="sumHR">-</span> lpm</div>
        <div class="summary"><strong>FR:</strong> <span id="sumRR">-</span> rpm</div>
        <div class="summary"><strong>SpO₂:</strong> <span id="sumSpO2">-</span>%</div>
        <div class="summary"><strong>TA:</strong> <span id="sumTA">-/ -</span> mmHg</div>
        <div class="summary"><strong>Temp:</strong> <span id="sumTemp">-</span> °C</div>
        <div class="summary"><strong>Glucemia:</strong> <span id="sumGlu">-</span> mg/dL</div>
      </div>
    </div>
  </div>

  <div class="panel" id="fullHistoryPanel" style="display:none">
    <h2>Historial de signos vitales</h2>
    <div id="historyList"></div>
  </div>

  <div style="text-align:center;margin-top:8px;color:var(--muted);font-size:12px">Prototipo — pedir mejoras para PWA / sincronización</div>
</div>

<script>
const patientName = document.getElementById('patientName');
const patientId = document.getElementById('patientId');
const historyList = document.getElementById('historyList');
const fullHistoryPanel = document.getElementById('fullHistoryPanel');
let vitalsHistory = [];

function readPatientHeader(){
  const name = document.getElementById('name').value || 'Paciente Ejemplo';
  const idType = document.getElementById('idType').value;
  const idNumber = document.getElementById('idNumber').value;
  patientName.textContent = name;
  patientId.textContent = idType && idNumber ? `${idType} • ${idNumber}` : '';
}

function updateSummary(current){
  document.getElementById('sumHR').textContent = current.hr || '-';
  document.getElementById('sumRR').textContent = current.rr || '-';
  document.getElementById('sumSpO2').textContent = current.spo2 || '-';
  document.getElementById('sumTA').textContent = (current.sbp || '-') + '/' + (current.dbp || '-');
  document.getElementById('sumTemp').textContent = current.temp || '-';
  document.getElementById('sumGlu').textContent = current.glucose || '-';
}

function clearVitalsInputs(){
  ['hr','rr','spo2','temp','sbp','dbp','glucose'].forEach(id => document.getElementById(id).value = '');
}

function saveVitals(){
  const v = {
    hr: document.getElementById('hr').value,
    rr: document.getElementById('rr').value,
    spo2: document.getElementById('spo2').value,
    temp: document.getElementById('temp').value,
    sbp: document.getElementById('sbp').value,
    dbp: document.getElementById('dbp').value,
    glucose: document.getElementById('glucose').value,
    time: new Date().toLocaleString()
  };
  vitalsHistory.push(v);
  renderHistory();
  updateSummary(v);
  clearVitalsInputs();
  readPatientHeader();
  document.getElementById('vitalsMessage').textContent = 'Valores guardados';
}

function renderHistory(){
  historyList.innerHTML = '';
  if(vitalsHistory.length === 0){
    fullHistoryPanel.style.display = 'none';
    return;
  }
  fullHistoryPanel.style.display = 'block';
  vitalsHistory.forEach().forEach((v, idx) => {
    const i = vitalsHistory.length - 1 - idx;
    const row = document.createElement('div');
    row.className = 'history-item';
    const left = document.createElement('div');
    left.innerHTML = `<div style="font-weight:600">${v.time}</div>
      <div class="small">FC: ${v.hr} lpm — FR: ${v.rr} rpm — SpO₂: ${v.spo2}%</div>
      <div class="small">Temp: ${v.temp} °C — TA: ${v.sbp}/${v.dbp} — Glu: ${v.glucose} mg/dL</div>`;
    const right = document.createElement('div');
    const del = document.createElement('button');
    del.className = 'btn danger';
    del.textContent = 'Eliminar';
    del.onclick = () => { vitalsHistory.splice(i,1); renderHistory(); };
    right.appendChild(del);
    row.appendChild(left);
    row.appendChild(right);
    historyList.appendChild(row);
  });
}

document.getElementById('saveVitalsBtn').addEventListener('click', saveVitals);

['name','idType','idNumber'].forEach(id => document.getElementById(id).addEventListener('input', readPatientHeader));
</script>
</body>
</html>
